<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <title>eID NFC Bridge — Card Template</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
    }

    /* ══════════════ Flip container ══════════════
       Only one face is ever visible — click the card (or the hint) to
       rotate to the other one. Both faces occupy the exact same box;
       backface-visibility is what keeps the "wrong" one from showing
       through mid-rotation.
    ═══════════════════════════════════════════════ */

    .topbar {
      width: 100%;
      height: 48px;
      flex-shrink: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* The <html> element is dir="rtl" (Arabic card face) — without this,
         flexbox's "start" edge flips to the right, so space-between puts
         the left-hand action on the right instead, landing it on top of
         whichever right-hand action is showing. This is UI chrome, not
         Arabic content, so pin it to LTR regardless of the document. */
      direction: ltr;
      padding: 0 16px;
    }

    /* Every topbar action (flip hint, Manual Scan, Clear Scan) shares this
       one plain-text-link style — no button chrome — so the row reads as
       one consistent set of actions rather than a hint next to a button. */
    .topbar-link {
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #94a3b8;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }

    .topbar-link:hover {
      color: #cbd5e1;
    }

    .topbar-link:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .flip-hint {
      display: flex;
    }

    /* Manual Scan and Clear Scan occupy the same right-hand slot and are
       mutually exclusive — Manual Scan when there's nothing to clear yet,
       Clear Scan once there's a scan to go back from. Both derive their
       visibility purely from the card's own empty state (never toggled
       separately), so neither can drift out of sync with what's actually
       on the card, whether that's from the initial load or a later
       IPC-pushed update. */
    .manual-scan-link,
    .clear-scan-link {
      display: none;
    }

    body:has(.flip-card.empty) .manual-scan-link {
      display: flex;
    }

    body:has(.flip-card:not(.empty)) .clear-scan-link {
      display: flex;
    }

    .scene-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 0 20px 20px;
      min-height: 0;
    }

    .flip-scene {
      /* aspect-ratio only derives a MISSING dimension from a definite one —
         with both width and height set to 100% (even though that's not an
         absolute value) it has nothing left to fill in, so it's silently
         ignored and the box just distorts to match the container's own
         ratio. Only width is definite here; height stays auto so
         aspect-ratio actually gets to compute it. The min() picks whichever
         candidate width is tighter — 100% of the available horizontal
         space, or (available vertical space) converted to its equivalent
         width via the 856:540 ratio (48px topbar + 20px .scene-wrap bottom
         padding = 68px of vertical chrome to subtract) — so the card is
         always "contain"-fitted rather than overflowing either axis.
         Every field position/font-size inside is %/cqi (relative to
         .card-face's own container-type: inline-size), so they scale right
         along with whatever width this resolves to. */
      width: min(100%, calc((100vh - 68px) * (856 / 540)));
      aspect-ratio: 856 / 540;
      flex-shrink: 1;
      min-width: 0;
      perspective: 2400px;
    }

    .flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.4, .2, .2, 1);
    }

    .flip-card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      backface-visibility: hidden;
      /* cqi units (font-size) scale relative to this container's inline size */
      container-type: inline-size;
    }

    .card-face.card-back {
      transform: rotateY(180deg);
    }

    /* Empty state — no card scanned yet: hide the printed card art and all
       overlaid fields/photos, show a plain placeholder instead. */
    .empty-message {
      display: none;
    }

    .flip-card.empty .card-bg,
    .flip-card.empty .f,
    .flip-card.empty .back-mrz,
    .flip-card.empty .front-photo-large,
    .flip-card.empty .front-photo-ghost,
    .flip-card.empty .back-photo-ghost,
    .flip-card.empty .back-signature {
      display: none;
    }

    .flip-card.empty .empty-message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px dashed #475569;
      border-radius: 22px;
      background: #1a1d24;
      color: #64748b;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .empty-message .empty-icon {
      font-size: 32px;
    }

    .empty-title {
      color: #64748b;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .f {
      position: absolute;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      font-weight: 700;
      color: #1c2a08;
      white-space: nowrap;
      line-height: 1;
    }

    /* ══════════════ FRONT (Arabic face) ══════════════
       Reference: card_back_sample.png (1369×869)
       Card number at top-center below the guilloche header
       Large portrait: left column
       All labels are in the BG image; we only overlay values
    ════════════════════════════════════════════════════ */

    /* Card number — sits in the cream band below the wavy header */
    .front-card-number {
      top: 24.5%;
      left: 29.2%;
      right: 51%;
      text-align: center;
      font-size: 3cqi;
      letter-spacing: .15cqi;
      color: #18100a;
      direction: ltr;
    }

    /* Large portrait (left column) */
    .front-photo-large {
      position: absolute;
      top: 39.5%;
      left: 4.5%;
      width: 23.5%;
      height: 51%;
      object-fit: cover;
      /* cqi, not px — a fixed px radius doesn't scale with the card, so it
         looks proportionally right only at the one size it was picked at
         (too sharp on a large window, too round/blobby on a small one). */
      border-radius: 3.5cqi;
    }

    /* Small ghost thumbnail (center-top window) */
    .front-photo-ghost {
      position: absolute;
      top: 37.7%;
      left: 33%;
      width: 10.5%;
      height: 18.5%;
      object-fit: cover;
      border-radius: 3.5cqi;
      filter: grayscale(1);
      opacity: 0.45;
      mix-blend-mode: multiply;
    }

    /* Right-side values */
    .front-issuing-auth {
      top: 28.4%;
      right: 16%;
      font-size: 3cqi;
    }

    .front-date-issue {
      top: 34.8%;
      right: 16%;
      font-size: 3cqi;
    }

    .front-date-expiry {
      top: 40.9%;
      right: 16%;
      font-size: 3cqi;
    }

    .front-nin {
      top: 58.4%;
      right: 20.5%;
      font-size: 3cqi;
      letter-spacing: .12cqi;
    }

    .front-surname {
      top: 63.8%;
      right: 9%;
      font-size: 3cqi;
    }

    .front-firstname {
      top: 74.9%;
      right: 9.5%;
      font-size: 3cqi;
    }

    .front-dob {
      top: 85.9%;
      right: 15%;
      font-size: 3cqi;
    }

    .front-pob {
      top: 91.1%;
      right: 15%;
      font-size: 3cqi;
    }

    /* Gender & blood — overlaid on bottom strip */
    .front-gender {
      top: 86%;
      left: 53.4%;
      font-size: 3cqi;
      direction: rtl;
      color: #1c2a08;
    }

    .front-blood {
      top: 86%;
      left: 39.3%;
      font-size: 3cqi;
      direction: ltr;
      color: #18100a;
    }

    /* ══════════════ BACK (French / chip face) ══════════════
       Reference: card_front_sample.png (1380×869)
    ════════════════════════════════════════════════════════ */

    .back-nom {
      top: 6.5%;
      left: 12.5%;
      font-size: 3cqi;
      direction: ltr;
    }

    .back-prenom {
      top: 16.5%;
      left: 18.5%;
      font-size: 3cqi;
      direction: ltr;
    }

    .back-birth-year {
      top: 33.5%;
      left: 36%;
      font-size: 3cqi;
      color: #2a2010;
      direction: ltr;
    }

    /* Ghost photo in transparent window (flipped horizontally) */
    .back-photo-ghost {
      position: absolute;
      top: 38%;
      left: 55.5%;
      width: 11.8%;
      height: 18.9%;
      object-fit: cover;
      border-radius: 3.5cqi;
      filter: grayscale(1);
      opacity: 0.45;
      transform: scaleX(-1);
      mix-blend-mode: multiply;
    }

    .back-signature {
      position: absolute;
      top: 43.9%;
      left: 78%;
      width: 11.3%;
      height: 15.4%;
      object-fit: contain;
      /* 3px at native width ≈ 0.35cqi — see .front-photo-large for why cqi. */
      border-radius: 0.35cqi;
      mix-blend-mode: multiply;
    }

    @font-face {
      font-family: 'OCR-B';
      font-style: normal;
      font-weight: normal;
      src: local('OCR-B'),
        url('../assets/fonts/OCR-B.ttf') format('truetype'),
        url('../assets/fonts/OCR-B.otf') format('opentype');
    }

    .back-mrz {
      position: absolute;
      top: 70.5%;
      left: 3%;
      font-family: 'OCR-B', monospace;
      font-weight: 400;
      font-size: 3.5cqi;
      color: #0a0a0a;
      letter-spacing: .05cqi;
      line-height: 1.72;
      direction: ltr;
      white-space: pre;
    }

  </style>
</head>

<body>

  <div class="topbar">
    <button type="button" class="topbar-link flip-hint" onclick="document.getElementById('flip-card').classList.toggle('flipped')">
      ⟲ Click card to flip
    </button>
    <button type="button" class="topbar-link manual-scan-link" onclick="requestManualScan()">Manual Scan</button>
    <button type="button" id="clear-scan-btn" class="topbar-link clear-scan-link" onclick="clearScan()">✕ Clear Scan</button>
  </div>

  <div class="scene-wrap">
    <div class="flip-scene">
      <div class="flip-card {{EMPTY_STATE_CLASS}}" id="flip-card"
        onclick="this.classList.toggle('flipped')">

        <!-- ══════ FRONT (Arabic face) ══════ -->
        <div class="card-face card-front">
          <img class="card-bg" src="../assets/card-front.png" />

          <!-- Photos: replace src with real base64 from scan -->
          <img class="front-photo-large" src="{{FACE_PHOTO_SRC}}" onerror="this.onerror=null; this.src='../assets/sample-photo.png'" />
          <img class="front-photo-ghost" src="{{FACE_PHOTO_SRC}}" onerror="this.onerror=null; this.src='../assets/sample-photo.png'" />

          <div class="f front-card-number">{{CARD_NUMBER}}</div>

          <!-- Right-side values -->
          <div class="f fr front-issuing-auth">{{ISSUING_AUTH}}</div>
          <div class="f fr front-date-issue">{{DATE_ISSUE}}</div>
          <div class="f fr front-date-expiry">{{DATE_EXPIRY}}</div>
          <div class="f fr front-nin">{{NIN}}</div>
          <div class="f fr front-surname">{{SURNAME_AR}}</div>
          <div class="f fr front-firstname">{{FIRSTNAME_AR}}</div>
          <div class="f fr front-dob">{{DOB}}</div>
          <div class="f fr front-pob">{{POB}}</div>

          <div class="f front-gender">{{GENDER_AR}}</div>
          <div class="f front-blood">{{BLOOD_TYPE}}</div>

          <div class="empty-message">
            <span class="empty-icon">🪪</span>
            <div class="empty-title">No Card Scanned Yet</div>
            <!-- Manual testing (POST /scan with typed MRZ credentials)
                 lives in its own proper dialog — tray menu's "Manual Scan…". -->
          </div>
        </div>

        <!-- ══════ BACK (French / chip face) ══════ -->
        <div class="card-face card-back">
          <img class="card-bg" src="../assets/card-back.png" />

          <div class="f back-nom">{{SURNAME_LATIN}}</div>
          <div class="f back-prenom">{{FIRSTNAME_LATIN}}</div>
          <div class="f back-birth-year">{{BIRTH_YEAR}}</div>

          <!-- Transparent window ghost photo (flipped) and signature -->
          <img class="back-photo-ghost" src="{{FACE_PHOTO_SRC}}" onerror="this.onerror=null; this.src='../assets/sample-photo.png'" />
          <img class="back-signature" src="{{SIGNATURE_SRC}}" onerror="this.onerror=null; this.src='../assets/sample-signature.png'" />

          <pre class="f back-mrz">{{MRZ_LINE1}}
{{MRZ_LINE2}}
{{MRZ_LINE3}}</pre>

          <div class="empty-message">
            <span class="empty-icon">🪪</span>
            No Card Scanned Yet
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Applies a computeCardValues()-shaped payload to the page in place —
    // no navigation, so the flip position and window focus are untouched.
    // Called both right after this
    // page's own initial load (window.nfcBridge may push a payload that's
    // newer than what was server-rendered, if a scan landed in the gap)
    // and on every later scan-update pushed over the IPC bus.
    function applyScanFields(data) {
      var f = data.fields;
      setText('.front-card-number', f.CARD_NUMBER);
      setText('.front-issuing-auth', f.ISSUING_AUTH);
      setText('.front-date-issue', f.DATE_ISSUE);
      setText('.front-date-expiry', f.DATE_EXPIRY);
      setText('.front-nin', f.NIN);
      setText('.front-surname', f.SURNAME_AR);
      setText('.front-firstname', f.FIRSTNAME_AR);
      setText('.front-dob', f.DOB);
      setText('.front-pob', f.POB);
      setText('.front-gender', f.GENDER_AR);
      setText('.front-blood', f.BLOOD_TYPE);
      setText('.back-nom', f.SURNAME_LATIN);
      setText('.back-prenom', f.FIRSTNAME_LATIN);
      setText('.back-birth-year', f.BIRTH_YEAR);
      setText('.back-mrz', f.MRZ_LINE1 + '\n' + f.MRZ_LINE2 + '\n' + f.MRZ_LINE3);

      setSrc('.front-photo-large', data.facePhotoSrc, '../assets/sample-photo.png');
      setSrc('.front-photo-ghost', data.facePhotoSrc, '../assets/sample-photo.png');
      setSrc('.back-photo-ghost', data.facePhotoSrc, '../assets/sample-photo.png');
      setSrc('.back-signature', data.signatureSrc, '../assets/sample-signature.png');

      document.getElementById('flip-card').classList.toggle('empty', !data.hasScan);
    }

    function setText(selector, value) {
      var el = document.querySelector(selector);
      if (el) el.textContent = value;
    }

    function setSrc(selector, value, fallback) {
      var el = document.querySelector(selector);
      if (!el) return;
      // Guard against the same infinite-retry-loop pitfall as the
      // server-rendered onerror handlers: null the handler out before
      // falling back, so a *also*-failing fallback is a terminal broken-
      // image icon, not another onerror firing forever.
      el.onerror = function () {
        this.onerror = null;
        this.src = fallback;
      };
      el.src = value;
    }

    // Goes back to the blank/empty state without closing the window —
    // clears server-side state and lets the resulting scan-update push
    // (see electron-main.js's ipcMain.on('clear-scan', ...)) repaint the
    // page, same as any other update.
    function clearScan() {
      if (window.nfcBridge) window.nfcBridge.requestClear();
    }

    // Opens the Manual Scan dialog (its own small modal window — see
    // manual-scan-dialog.html/.js) parented to this one. Only the main
    // process can create windows, so this just asks it to.
    function requestManualScan() {
      if (window.nfcBridge) window.nfcBridge.requestManualScan();
    }

    // window.nfcBridge only exists inside the real preview window (exposed
    // by preload.cjs) — undefined when this page is opened as a raw file,
    // where there's nothing to subscribe to anyway.
    if (window.nfcBridge) {
      window.nfcBridge.onScanUpdate(applyScanFields);
    }
  </script>

</body>

</html>
