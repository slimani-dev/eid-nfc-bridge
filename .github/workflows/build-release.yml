name: Build release installers

# Builds the Windows .exe and Linux .deb on their native OS runners (each
# ships its own real compiler toolchain) so the pcsclite native addon is
# always compiled for the platform it will actually run on, instead of
# being cross-built and packaged from a mismatched OS. See
# WINDOWS-BRIDGE-TEST-HANDOVER.md for the incident that motivated this.
#
# Publishing is done in one dedicated job after both builds finish, using
# a single action-gh-release call for both files. electron-builder's own
# --publish step was tried first and reliably split each release in two
# (a GitHub-publish race on its own asset uploads) — this app has no
# electron-updater dependency, so there's no need for electron-builder's
# publish/update-metadata machinery at all.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Rebuild pcsclite native addon for Electron/win32/x64
        run: npx electron-rebuild -f -w pcsclite

      - name: Build installer
        run: npx electron-builder --win --x64

      - uses: actions/upload-artifact@v4
        with:
          name: eID-NFC-Bridge-Setup-win
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pcsclite system libraries
        run: sudo apt-get update && sudo apt-get install -y libpcsclite1 libpcsclite-dev

      - run: npm ci

      - name: Rebuild pcsclite native addon for Electron/linux/x64
        run: npx electron-rebuild -f -w pcsclite

      - name: Build installer
        run: npx electron-builder --linux deb

      - uses: actions/upload-artifact@v4
        with:
          name: eID-NFC-Bridge-Setup-linux
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/eID-NFC-Bridge-Setup-win/*.exe
            dist/eID-NFC-Bridge-Setup-linux/*.deb
