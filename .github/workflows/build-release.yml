name: Build release installers

# Builds the Windows .exe and Linux .deb on their native OS runners (each
# ships its own real compiler toolchain) so the pcsclite native addon is
# always compiled for the platform it will actually run on, instead of
# being cross-built and packaged from a mismatched OS. See
# WINDOWS-BRIDGE-TEST-HANDOVER.md for the incident that motivated this.
#
# The two jobs run sequentially (not in parallel) because electron-builder
# creates the GitHub release for a tag on first publish; two jobs racing to
# create it at once can end up creating duplicate draft releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Rebuild pcsclite native addon for Electron/win32/x64
        run: npx electron-rebuild -f -w pcsclite

      - name: Build installer
        run: npx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: eID-NFC-Bridge-Setup-win
          path: dist/*.exe

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pcsclite system libraries
        run: sudo apt-get update && sudo apt-get install -y libpcsclite1 libpcsclite-dev

      - run: npm ci

      - name: Rebuild pcsclite native addon for Electron/linux/x64
        run: npx electron-rebuild -f -w pcsclite

      - name: Build installer
        run: npx electron-builder --linux deb --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: eID-NFC-Bridge-Setup-linux
          path: dist/*.deb
